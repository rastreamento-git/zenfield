services:
  - type: web
    name: zenfield
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://zencontrol.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
